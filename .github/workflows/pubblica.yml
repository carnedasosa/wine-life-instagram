name: Pubblica su Instagram

on:
  schedule:
    - cron: "7,37 * * * *"   # ogni 30 minuti controlla il calendario (minuti 7 e 37: meno coda che a :00 e :30)
  workflow_dispatch:
    inputs:
      post:
        description: "id del post da pubblicare subito (vuoto = segui il calendario)"
        required: false
      verifica:
        description: "solo verifica: prepara il post su Instagram ma non lo pubblica (serve anche post)"
        type: boolean
        default: false

permissions:
  contents: write

# Un giro alla volta: se due partono insieme (cron + attività di Windows) lo stesso post esce due volte (successo il 3/11).
concurrency:
  group: pubblica-instagram
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pubblicazione
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # l'ultima versione del branch: un giro rimasto in coda deve vedere il pubblicati.json aggiornato
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pubblica i post arrivati alla loro ora
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/pubblicazione/jpg
          POST_ID: ${{ inputs.post }}
          VERIFICA: ${{ inputs.verifica }}
        run: |
          if [ "$VERIFICA" = "true" ]; then python3 publish.py --check --post "$POST_ID"
          elif [ -n "$POST_ID" ]; then python3 publish.py --post "$POST_ID"
          else python3 publish.py --due; fi
      - name: Salva lo stato
        run: |
          git config user.name "wine-life-bot"
          git config user.email "actions@github.com"
          git add pubblicati.json 2>/dev/null || exit 0
          git diff --cached --quiet || (git commit -m "Pubblicato su Instagram" && git pull --rebase && git push)
      # Numeri per il pannello social: follower e metriche dei post, letti con lo stesso token.
      # Non pubblica niente. Nei giri automatici legge al massimo ogni 3 ore (lo decide insights.py) e negli altri
      # dura un secondo; un giro lanciato a mano legge sempre, così serve anche da controllo del token.
      # Se il token è stato invalidato (errore 190) questo passo fallisce: il giro diventa rosso e lo si vede
      # subito, invece che al primo post che non esce. Ogni altro problema lascia il giro verde.
      - name: Numeri per il pannello
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          esito=0
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then ogni="--ogni-ore 3"; else ogni=""; fi
          python3 insights.py $ogni || esito=$?
          # Salvare il file non deve far fallire il giro: se il push non riesce, si rilegge al prossimo.
          if [ -f insights.json ]; then
            git config user.name "pannello-numeri" || true
            git config user.email "actions@github.com" || true
            git add insights.json || true
            if ! git diff --cached --quiet; then
              git commit -q -m "Numeri Instagram" && { git pull -q --rebase && git push -q || { sleep 10; git pull -q --rebase && git push -q; }; }                 || echo "::warning::Numeri letti ma non salvati nel repo: riprovo al prossimo giro"
            fi
          fi
          exit $esito
